name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify Live Supabase Static Scan (Phase 16)
        run: node ../scripts/scan-live-supabase.js
      - name: Verify no leaked secrets in frontend bundle
        run: |
          ! grep -rn "SUPABASE_SERVICE_ROLE_KEY" dist/ || exit 1
          ! grep -rn "OPENROUTER_API_KEY" dist/ || exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend typecheck, security tests, and build
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      AI_SERVICE_SHARED_SECRET: ci-ai-shared-secret-at-least-16-chars
      SESSION_TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MFA_ENCRYPTION_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      INTERNAL_HEALTH_SECRET: ci-internal-health-secret-32-bytes
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Run Backend & Security Attack Test Suite
        run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist
          if-no-files-found: error
          retention-days: 7

  ai-service:
    name: AI Intelligence Service Tests & Smoke Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-services
    env:
      AI_ENVIRONMENT: development
      AI_ALLOW_INSECURE_DEV: "true"
      AI_ENABLE_OPENROUTER: "false"
      AI_STATE_DIR: ./state
      AI_MODEL_DIR: ./models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-services/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run Pytest Suite
        run: python -m pytest tests/ -v
      - name: Run AI Model Smoke Test
        run: python scripts/model_smoke_test.py

  chaincode:
    name: Hyperledger Fabric Chaincode Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain/chaincode/nirikshak-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blockchain/chaincode/nirikshak-audit/package-lock.json
      - run: npm ci
      - name: Run Contract Security & Unit Tests
        run: npm test
      - name: Build Production Chaincode Bundle
        run: npm run build

  database-migrations:
    name: Supabase Clean Migration and RLS Gate (001 -> Final)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Start real local Supabase services
        working-directory: backend
        run: supabase start
      - name: Reset and apply all migrations against Supabase schemas
        working-directory: backend
        run: supabase db reset --local --yes
      - name: Execute tenant and RLS integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npx tsx scripts/security-integration-test.ts
      - name: Prove cross-tenant row isolation
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npx tsx scripts/tenant-rls-integration-test.ts
      - name: Stop local Supabase services
        if: always()
        working-directory: backend
        run: supabase stop --no-backup

  secret-scan:
    name: Secret Hygiene & Gitleaks Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Rigorous Secret Scan
        run: |
          echo "Scanning for leaked private keys, production tokens, or cloud secrets..."
          ! find . -type f \( -name "*_sk" -o -name "*.pem" -o -name "id_rsa" -o -name "*.p12" \) ! -path "*/node_modules/*" ! -path "*/.git/*" | grep . || exit 1
          echo "✔ Secret audit passed: zero leaked secrets found."

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit Frontend Dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Audit Backend Dependencies
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Audit Chaincode Dependencies
        working-directory: blockchain/chaincode/nirikshak-audit
        run: npm audit --audit-level=high
