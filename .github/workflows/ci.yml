name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify no leaked secrets in frontend bundle
        run: |
          ! grep -rn "SUPABASE_SERVICE_ROLE_KEY" frontend/dist/ || exit 1
          ! grep -rn "OPENROUTER_API_KEY" frontend/dist/ || exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend typecheck, security tests, and build
    runs-on: ubuntu-latest
    env:
      # Non-secret placeholders required at module initialization. Tests mock all
      # external calls and never connect to this URL.
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      AI_SERVICE_SHARED_SECRET: ci-ai-shared-secret-at-least-16-chars
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Run Backend & Security Attack Test Suite
        run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist
          if-no-files-found: error
          retention-days: 7

  ai-service:
    name: AI Intelligence Service Tests & Smoke Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-services
    env:
      AI_ENVIRONMENT: development
      AI_ALLOW_INSECURE_DEV: "true"
      AI_ENABLE_OPENROUTER: "false"
      AI_STATE_DIR: ./state
      AI_MODEL_DIR: ./models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-services/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run Pytest Suite
        run: python -m pytest tests/ -v
      - name: Run AI Model Smoke Test
        run: python scripts/model_smoke_test.py
