---
# ---------------------------------------------------------------------------
# NIRIKSHAK Craftverse Hyperledger Fabric Channel & Raft Topology
# ---------------------------------------------------------------------------

Organizations:
  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: ../network/crypto-config/ordererOrganizations/example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"

  - &GovernmentOrg
    Name: GovernmentOrgMSP
    ID: GovernmentOrgMSP
    MSPDir: ../network/crypto-config/peerOrganizations/government.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('GovernmentOrgMSP.admin', 'GovernmentOrgMSP.peer', 'GovernmentOrgMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('GovernmentOrgMSP.admin', 'GovernmentOrgMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('GovernmentOrgMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('GovernmentOrgMSP.peer')"
    AnchorPeers:
      - Host: peer0.government.example.com
        Port: 7051

  - &ContractorOrg
    Name: ContractorOrgMSP
    ID: ContractorOrgMSP
    MSPDir: ../network/crypto-config/peerOrganizations/contractor.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('ContractorOrgMSP.admin', 'ContractorOrgMSP.peer', 'ContractorOrgMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('ContractorOrgMSP.admin', 'ContractorOrgMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('ContractorOrgMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('ContractorOrgMSP.peer')"
    AnchorPeers:
      - Host: peer0.contractor.example.com
        Port: 8051

  - &AuditorOrg
    Name: AuditorOrgMSP
    ID: AuditorOrgMSP
    MSPDir: ../network/crypto-config/peerOrganizations/auditor.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('AuditorOrgMSP.admin', 'AuditorOrgMSP.peer', 'AuditorOrgMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('AuditorOrgMSP.admin', 'AuditorOrgMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('AuditorOrgMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('AuditorOrgMSP.peer')"
    AnchorPeers:
      - Host: peer0.auditor.example.com
        Port: 9051

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_5: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    AuditEndorsement:
      Type: Signature
      Rule: "AND('GovernmentOrgMSP.peer', 'AuditorOrgMSP.peer')"
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  Addresses:
    - orderer1.example.com:7050
    - orderer2.example.com:7050
    - orderer3.example.com:7050
  EtcdRaft:
    Consenters:
      - Host: orderer1.example.com
        Port: 7050
        ClientTLSCert: ../network/crypto-config/ordererOrganizations/example.com/orderers/orderer1.example.com/tls/server.crt
        ServerTLSCert: ../network/crypto-config/ordererOrganizations/example.com/orderers/orderer1.example.com/tls/server.crt
      - Host: orderer2.example.com
        Port: 7050
        ClientTLSCert: ../network/crypto-config/ordererOrganizations/example.com/orderers/orderer2.example.com/tls/server.crt
        ServerTLSCert: ../network/crypto-config/ordererOrganizations/example.com/orderers/orderer2.example.com/tls/server.crt
      - Host: orderer3.example.com
        Port: 7050
        ClientTLSCert: ../network/crypto-config/ordererOrganizations/example.com/orderers/orderer3.example.com/tls/server.crt
        ServerTLSCert: ../network/crypto-config/ordererOrganizations/example.com/orderers/orderer3.example.com/tls/server.crt
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 100
    AbsoluteMaxBytes: 10 MB
    PreferredMaxBytes: 2 MB
  Organizations:
    - *OrdererOrg
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  Capabilities:
    <<: *OrdererCapabilities

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  NirikshakGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
    Consortiums:
      NirikshakConsortium:
        Organizations:
          - *GovernmentOrg
          - *ContractorOrg
          - *AuditorOrg

  NirikshakChannel:
    <<: *ChannelDefaults
    Consortium: NirikshakConsortium
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *GovernmentOrg
        - *ContractorOrg
        - *AuditorOrg
